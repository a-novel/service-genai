# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: internal/models/proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DEFINED
breaking:
  use:
    - FILE
  ignore_only:
    FILE_NO_DELETE:
      # v0.1.2 gives the Status descriptor a service-specific name so consumers can
      # import it alongside other Agora clients without a global protobuf registry panic.
      - internal/models/proto/status.proto
