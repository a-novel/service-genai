# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: internal/models/proto
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  ignore_only:
    FILE_NO_DELETE:
      # The first versioned contract intentionally moves every pre-v1 descriptor. Remove these
      # exceptions once master itself is the versioned baseline for breaking-change checks.
      - internal/models/proto/generation.proto
      - internal/models/proto/generation_cancel.proto
      - internal/models/proto/generation_get.proto
      - internal/models/proto/generation_submit.proto
      - internal/models/proto/generation_watch.proto
      - internal/models/proto/status.proto
      - internal/models/proto/usage_query.proto
