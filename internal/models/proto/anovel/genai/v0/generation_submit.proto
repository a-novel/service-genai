syntax = "proto3";

package anovel.genai.v0;

import "anovel/genai/v0/generation.proto";
import "google/protobuf/duration.proto";

// GenerationSubmitService records a generation and starts it in the Async mode: the call runs on the
// provider's side while the caller polls GenerationGet.
service GenerationSubmitService {
  // Records a generation and starts its provider call. Resending the same request is a replay: it
  // returns the generation already pending, running or succeeded, so the call is paid once. A
  // request whose generation failed or was cancelled runs again from scratch. This service never
  // resends a call itself: the caller reads a failure's failure_class and decides whether to resend.
  //
  // Returns INVALID_ARGUMENT with the reason for an invalid request, an undeclared purpose or an
  // unknown provider included; UNIMPLEMENTED for a provider without the Async mode; and
  // RESOURCE_EXHAUSTED, naming the limit, when the user already reached one. That refusal carries a
  // google.rpc.QuotaFailure with one violation: its subject names the limits that refused, such as
  // `purpose "studio.generation"`, `ceiling` or `global`, and its description the limit, such as
  // `concurrency 2` or `input tokens over 5h`. A window's refusal adds a google.rpc.RetryInfo when
  // the window frees usage at a known time: its delay runs until the window's oldest usage leaves
  // it.
  rpc GenerationSubmit(GenerationSubmitRequest) returns (GenerationSubmitResponse);
}

// GenerationSubmitRequest carries a new generation. The server mints the id and the timestamps.
message GenerationSubmitRequest {
  // OwnerID is the user this acts for, formatted as a UUID. The calling service verifies it against
  // its own credential, and this service trusts it as sent.
  string owner_id = 1;
  // Purpose labels why the call is made, such as "studio.generation". Required, and declared in the
  // service's caps file, which sets how much each user may consume for it.
  string purpose = 2;
  // Provider names the service to run the call on, such as "openai". Required.
  string provider = 11;
  // Payload is the provider's own request body: a JSON object the caller builds, which this service
  // forwards without reading. Required, at most 16 MiB, and I-JSON (RFC 7493): valid UTF-8,
  // no unpaired surrogates, no duplicate names in an object. The provider's connector sets the fields
  // the Async mode needs, such as OpenAI's background and stream, over the payload's own values.
  bytes payload = 12;
  // UserTier is the usage tier the caller assigns its user, such as "premium". Without caps, it
  // selects the caps of the service's caps file that the submit answers to; an empty or unrecognized
  // tier answers to the default caps. With caps, it is ignored. It is left out of the request's
  // identity, so resending a request under another tier returns the same generation.
  string user_tier = 13;
  // Variant asks for another generation of a request that already succeeded, such as a regenerate.
  // It defaults to zero. A caller recovering from a crash counts variants from zero again, and each
  // one already run returns its stored result.
  uint32 variant = 10;
  // Stream creates the provider call in streaming mode, so GenerationStream can forward its events
  // while it runs. The submit then answers once the provider has begun the call, after its queue
  // time, or after 30 seconds with the call still queued. It is part of the request: the same
  // payload with and without it are two generations.
  bool stream = 14;
  // Caps are the limits the caller sets for its user on the request's purpose. Set, the submit
  // answers to them on the purpose and to the service's ceiling across every purpose, and user_tier
  // is ignored. Unset, it answers to the service's caps file. Caps are left out of the request's
  // identity, so resending a request under other caps returns the same generation.
  GenerationCaps caps = 15;

  // A request is identified by its own content and owner: the caller keeps no key to recover it.
  // Retries are this service's policy, and what runs is the caller's payload.
  reserved 3, 4, 5, 6, 7, 8, 9;
  reserved "idempotency_key", "request", "max_attempts", "tier", "instructions", "input", "output_schema";
}

// GenerationCaps limits one owner's generations of the request's purpose.
message GenerationCaps {
  // Concurrency is how many generations of the purpose the user may have in flight at once, this one
  // included: pending, running, or failed with an unknown outcome within the last 15 minutes. Unset,
  // it sets no limit. At least 0.
  optional int32 concurrency = 1;
  // Windows limit the tokens the user's generations of the purpose consumed over rolling windows. A
  // submit is refused once a window's usage reaches its limit. Empty, they set no limit. At most 10,
  // each of a distinct duration.
  repeated GenerationCapWindow windows = 2;
}

// GenerationCapWindow limits the tokens one owner consumed over a rolling window.
message GenerationCapWindow {
  // Duration is how far back the window reaches. Above zero, at most 8760 hours.
  google.protobuf.Duration duration = 1;
  // InputTokens limits the input tokens consumed in the window, cached ones included. Unset, it sets
  // no limit. At least 0.
  optional int64 input_tokens = 2;
  // OutputTokens limits the output tokens consumed in the window, reasoning ones included. Unset, it
  // sets no limit. At least 0.
  optional int64 output_tokens = 3;
}

// GenerationSubmitResponse returns the recorded generation and whether this call created it.
message GenerationSubmitResponse {
  // Generation is the recorded generation: the newly created one, or the existing one on a replay.
  Generation generation = 1;
  // Created is false when a pending, running or succeeded generation of the same request was
  // returned, so a caller resending after a lost connection attaches to work already paid for.
  bool created = 2;
}
