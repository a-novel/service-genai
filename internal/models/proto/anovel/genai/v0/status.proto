syntax = "proto3";

package anovel.genai.v0;

// StatusService reports dependency readiness and the queue's own backlog.
// Process-only liveness is provided separately by UnaryEcho.
service StatusService {
  // Status succeeds only when PostgreSQL and queue inspection succeed.
  // Otherwise it returns Unavailable with no response payload or private error details.
  rpc Status(StatusRequest) returns (StatusResponse);
}

// DependencyStatus reports whether a single dependency is reachable and serving.
enum DependencyStatus {
  // DEPENDENCY_STATUS_UNSPECIFIED means the status has not yet been assessed, or the assessment failed.
  DEPENDENCY_STATUS_UNSPECIFIED = 0;
  // DEPENDENCY_STATUS_UP means the dependency was successfully pinged and should serve normally.
  DEPENDENCY_STATUS_UP = 1;
  // DEPENDENCY_STATUS_DOWN means the dependency was reached but did not report a healthy status.
  DEPENDENCY_STATUS_DOWN = 2;
}

// DependencyHealth reports the health of a single external dependency.
//
// The message carries the state alone. A dependency health-check error routinely embeds
// internal hostnames, ports, or schema names. The error is recorded on the trace span for
// operators.
message DependencyHealth {
  // Number 2 and name "err" are reserved so a future field cannot re-introduce a raw error
  // string.
  reserved 2;
  reserved "err";

  // status is UP in a successful Status response.
  DependencyStatus status = 1;
}

// QueueDepth reports the queue's own backlog: how many generations are due to run and still
// waiting, and how long the oldest of them has waited. Two numbers rather than one — a count alone
// cannot tell a queue absorbing a burst from a stalled one, and the oldest-pending age is what
// separates them.
message QueueDepth {
  // pending is the number of generations due to run that no worker has claimed yet.
  int64 pending = 1;
  // oldest_pending_age_seconds is how long the oldest due-and-unclaimed generation has waited.
  // Zero when nothing is pending.
  double oldest_pending_age_seconds = 2;
}

// StatusRequest takes no parameters.
message StatusRequest {}

// StatusResponse contains healthy dependency reports and the measured backlog.
message StatusResponse {
  // postgres is the successfully probed database dependency.
  DependencyHealth postgres = 1;
  // queue is present in every successful response, including when the backlog is empty.
  QueueDepth queue = 2;
}
