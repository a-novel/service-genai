syntax = "proto3";

package anovel.genai.v0;

import "anovel/genai/v0/generation.proto";

// GenerationGetService reads one of an owner's generations.
service GenerationGetService {
  // Returns one of an owner's generations, checking it with the provider first when nobody checked
  // it recently. Poll it until the generation settles. Returns NOT_FOUND if the owner has no such
  // generation, including when another owner holds it, so the read cannot reveal whether an id
  // exists. Returns INVALID_ARGUMENT if an id is not a UUID.
  rpc GenerationGet(GenerationGetRequest) returns (GenerationGetResponse);
}

// GenerationGetRequest identifies the generation to read and the owner it must belong to.
message GenerationGetRequest {
  // ID of the generation to read, formatted as a UUID.
  string id = 1;
  // OwnerID scopes the read, formatted as a UUID.
  string owner_id = 2;
}

// GenerationGetResponse carries the requested generation.
message GenerationGetResponse {
  // The requested generation, with every attempt that reached an answer.
  Generation generation = 1;
}
