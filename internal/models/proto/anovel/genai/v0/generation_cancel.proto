syntax = "proto3";

package anovel.genai.v0;

import "anovel/genai/v0/generation.proto";

// GenerationCancelService stops a generation so an abandoned one stops costing.
//
// A generation that never started is cancelled at once. One whose provider call is known is stopped
// and settled within the call, recording whatever it consumed before the stop: a cancelled call is
// not a free one. One whose start is in flight is marked, and the next check stops it.
service GenerationCancelService {
  rpc GenerationCancel(GenerationCancelRequest) returns (GenerationCancelResponse);
}

// GenerationCancelRequest identifies the generation to stop and the owner it must belong to.
message GenerationCancelRequest {
  // ID of the generation to stop, formatted as a UUID.
  string id = 1;
  // OwnerID scopes the request, formatted as a UUID.
  string owner_id = 2;
}

// GenerationCancelResponse returns the generation as the cancellation left it: cancelled, or still
// running when the provider had not stopped the call yet.
message GenerationCancelResponse {
  Generation generation = 1;
}
