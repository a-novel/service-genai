# How a generation runs. Named for the shape of the work, never for a model or a vendor, so a
# caller can ask for "deep" and stay correct when the model behind it is swapped.
profiles:
  - name: fast
    description: Short, cheap, latency-sensitive work — classification and ranking.
    provider: openai
    model: gpt-5.6-luna
    maxOutputTokens: 4096

  - name: standard
    description: The workhorse for drafting prose.
    provider: openai
    model: gpt-5.6-terra
    maxOutputTokens: 16384

  - name: deep
    description: Highest quality, for work that justifies the cost.
    provider: openai
    model: gpt-5.6-sol
    maxOutputTokens: 32768
    reasoningEffort: high
