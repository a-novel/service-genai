# How a generation runs. A caller names a profile; the service resolves it to a provider, a model
# and its parameters.
#
# Profiles are named for the shape of the work, never for a model or a vendor. That is what keeps a
# caller's own definitions provider-agnostic: an engine can ask for "deep" and stay correct when the
# model behind it is swapped. A caller can never name a model, request an expensive one, or raise
# its own output ceiling.
profiles:
  - name: fast
    description: Short, cheap, latency-sensitive work — classification and ranking.
    provider: openai
    model: gpt-5.6-luna
    maxOutputTokens: 4096

  - name: standard
    description: The workhorse for drafting prose.
    provider: openai
    model: gpt-5.6-terra
    maxOutputTokens: 16384

  - name: deep
    description: Highest quality, for work that justifies the cost.
    provider: openai
    model: gpt-5.6-sol
    maxOutputTokens: 32768
    reasoningEffort: high
