# What each model costs, in currency per million tokens — the unit every provider publishes, so a
# ledger row can be checked against a public price sheet without arithmetic.
#
# This file is never fetched at runtime. A price change is a reviewed commit with a git history,
# which is the audit trail we want; a third party mutating our billing without a review is not.
# Seeded by hand and cross-checked against OpenAI's published pricing.
#
# Entries are effective-dated and additive: a rate change appends a new entry rather than editing an
# old one, so a past generation can still be priced with the rate that was in force when it ran.
# Values are quoted strings, never bare numbers — a YAML float would round the rate before it was
# ever used.
prices:
  - provider: openai
    model: gpt-5.6-luna
    currency: USD
    effectiveFrom: 2026-01-01T00:00:00Z
    inputPerMtoken: "1.00"
    cachedInputPerMtoken: "0.10"
    outputPerMtoken: "6.00"

  - provider: openai
    model: gpt-5.6-terra
    currency: USD
    effectiveFrom: 2026-01-01T00:00:00Z
    inputPerMtoken: "2.50"
    cachedInputPerMtoken: "0.25"
    outputPerMtoken: "15.00"

  - provider: openai
    model: gpt-5.6-sol
    currency: USD
    effectiveFrom: 2026-01-01T00:00:00Z
    inputPerMtoken: "5.00"
    cachedInputPerMtoken: "0.50"
    outputPerMtoken: "30.00"
