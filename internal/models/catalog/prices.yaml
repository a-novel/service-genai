# Per million tokens, the unit providers publish. Never fetched at runtime: a price change is a
# reviewed commit, and a third party must not be able to mutate our billing.
#
# Effective-dated and additive — a rate change appends, so a past generation is still priced with
# the rate that was in force. Values are quoted: a YAML float would round the rate before use.
prices:
  - provider: openai
    model: gpt-5.6-luna
    currency: USD
    effectiveFrom: 2026-01-01T00:00:00Z
    inputPerMtoken: "1.00"
    cachedInputPerMtoken: "0.10"
    outputPerMtoken: "6.00"

  - provider: openai
    model: gpt-5.6-terra
    currency: USD
    effectiveFrom: 2026-01-01T00:00:00Z
    inputPerMtoken: "2.50"
    cachedInputPerMtoken: "0.25"
    outputPerMtoken: "15.00"

  - provider: openai
    model: gpt-5.6-sol
    currency: USD
    effectiveFrom: 2026-01-01T00:00:00Z
    inputPerMtoken: "5.00"
    cachedInputPerMtoken: "0.50"
    outputPerMtoken: "30.00"
