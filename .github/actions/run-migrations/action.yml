name: run-migrations
description: Apply the schema migrations to the database POSTGRES_DSN names.

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
    - name: Download Go packages
      shell: bash
      run: go mod download
    - name: Run migrations
      shell: bash
      run: go run cmd/migrations/main.go
