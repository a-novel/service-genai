services:
  postgres:
    image: "${DATABASE_IMAGE:-service-genai-database:ci}"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

  standalone-grpc:
    profiles: ["grpc"]
    image: "${STANDALONE_GRPC_IMAGE:-service-genai-standalone-grpc:ci}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      # A closed port: starts are refused before reaching any provider, so generations fail at once.
      OPENAI_BASE_URL: http://127.0.0.1:1/v1
      OPENAI_API_KEY: test
