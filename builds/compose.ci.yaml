services:
  postgres:
    image: "${DATABASE_IMAGE:?DATABASE_IMAGE is required}"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  standalone-grpc:
    image: "${STANDALONE_GRPC_IMAGE:?STANDALONE_GRPC_IMAGE is required}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      # A closed port: starts are refused before reaching any provider, so generations stay pending.
      OPENAI_BASE_URL: http://127.0.0.1:1/v1
      OPENAI_API_KEY: test
