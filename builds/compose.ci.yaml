services:
  postgres:
    image: "${DATABASE_IMAGE:-service-genai-database:ci}"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

  standalone-grpc:
    profiles: ["grpc"]
    image: "${STANDALONE_GRPC_IMAGE:-service-genai-standalone-grpc:ci}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
