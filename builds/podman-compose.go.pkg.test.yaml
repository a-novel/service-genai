# Podman drops a Dockerfile's HEALTHCHECK from OCI images, the format it builds by default and the
# one images are published in: a service the others wait for declares its check here.
x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready"]
  interval: 1s
  timeout: 5s
  retries: 10

services:
  postgres-genai:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    networks:
      - genai-integration-grpc-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    healthcheck: *postgres-healthcheck

  service-genai:
    build:
      context: ..
      dockerfile: ./builds/standalone.grpc.Dockerfile
    ports:
      - "${GRPC_PORT}:8080"
    depends_on:
      postgres-genai:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-genai:5432/${POSTGRES_DB}?sslmode=disable"
      # A closed port: starts are refused before reaching any provider, so generations stay pending.
      OPENAI_BASE_URL: "http://127.0.0.1:1/v1"
      OPENAI_API_KEY: "test"
    networks:
      - genai-integration-grpc-test

networks:
  genai-integration-grpc-test:
