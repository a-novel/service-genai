services:
  postgres-genai:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    networks:
      - genai-integration-grpc-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-genai:
    build:
      context: ..
      dockerfile: ./builds/standalone.grpc.Dockerfile
    ports:
      - "${GRPC_PORT}:8080"
    depends_on:
      postgres-genai:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-genai:5432/${POSTGRES_DB}?sslmode=disable"
      # A closed port: starts are refused before reaching any provider, so generations stay pending.
      OPENAI_BASE_URL: "http://127.0.0.1:1/v1"
    networks:
      - genai-integration-grpc-test

networks:
  genai-integration-grpc-test:
